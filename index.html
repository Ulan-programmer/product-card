<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="style.css">
      <title>Торговая карточка</title>
</head>

<body>

      <main class="main">
            <img src="image/background.png" alt="background picture" class="background">
            <h1 class="main-title">Выбери свой продукт</h1>

            <div class="container" id="cards-container"></div>
            <template id="card-template">
                  <div class="card">
                        <img src="" alt="" class="card__image">
                        <div class="card__skin-type"></div>
                        <div class="card__product-name"></div>
                        <p class="card__main-text-effect"></p>

                        <div class="card__main-text-composition">Состав:</div>
                        <ul class="card__main-text-composition-list">

                        </ul>

                        <div class="price-container">
                              <div class="product__price-tag">Цена</div>
                              <div class="product__price"></div>
                        </div>
                  </div>
            </template>
            <script type="module" src="homework-10.js"></script>
</body>

</html>
